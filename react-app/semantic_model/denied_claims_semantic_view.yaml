# Semantic View YAML for Cortex Analyst / Cortex Agents.
#
# IMPORTANT: This is the *Semantic View* specification, which is NOT the same as
# the legacy Cortex Analyst stage-API spec used by denied_claims_model.yaml.
# Differences that matter:
#   * facts/metrics instead of measures + default_aggregation
#   * no join_type or relationship_type (inferred from the data)
#   * verified_queries[].verified_at is epoch seconds, not a date string
#
# Deploy with sql/04_cortex_services.sql, which calls
# SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML. Validate a change before committing:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('db.schema', <this file>, TRUE);
#   (pass the file contents as a dollar-quoted literal; see sql/04_cortex_services.sql)
#
# __APP_DATABASE__ / __APP_SCHEMA__ are substituted by scripts/configure.sh.

name: DENIED_CLAIMS_AGENT_SV
