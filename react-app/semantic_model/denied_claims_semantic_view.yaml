verified_queries:
  - name: '"0;1"'
    sql: "SELECT dh.DENIAL_CODE, dh.DENIAL_GROUP, dh.PAYER_ID, dh.OVERTURN_RATE_PCT, dh.TOTAL_DENIALS, dh.OVERTURNED_COUNT FROM denial_history AS dh WHERE dh.OVERTURN_RATE_PCT > 50 ORDER BY dh.OVERTURN_RATE_PCT DESC"
    question: Which denial codes have the highest overturn rates above 50%?
    verified_at: 1777486360
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"1;1"'
    sql: "SELECT d.DENIAL_CODE, d.DENIAL_GROUP, COUNT(*) AS denial_count, SUM(d.DENIAL_AMOUNT) AS total_denied FROM denials AS d GROUP BY d.DENIAL_CODE, d.DENIAL_GROUP ORDER BY total_denied DESC"
    question: What are the top denial codes by total denied amount?
    verified_at: 1777486360
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"2;1"'
    sql: "SELECT wi.STATUS, wi.PRIORITY, COUNT(*) AS item_count FROM denial_work_items AS wi GROUP BY wi.STATUS, wi.PRIORITY ORDER BY item_count DESC"
    question: How many work items are in each status and priority combination?
    verified_at: 1777486360
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"3;1"'
    sql: "SELECT c.PAYER_ID, c.PROVIDER_NAME, d.DENIAL_CODE, d.DENIAL_REASON, d.DENIAL_AMOUNT, d.DENIAL_DATE FROM denials AS d JOIN claims AS c ON d.CLAIM_ID = c.CLAIM_ID WHERE d.DENIAL_DATE >= DATEADD(DAY, -30, CURRENT_DATE) ORDER BY d.DENIAL_AMOUNT DESC"
    question: What are the recent denials in the last 30 days with claim details?
    verified_at: 1777486360
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"4;1"'
    sql: "SELECT pa.AUTH_ID, pa.AUTH_STATUS, pa.SERVICE_CATEGORY, pa.VALID_FROM, pa.VALID_TO, pa.UNITS_APPROVED, pa.UNITS_USED FROM prior_auth AS pa WHERE pa.AUTH_STATUS = 'APPROVED' AND pa.VALID_TO >= CURRENT_DATE"
    question: What active prior authorizations are currently approved?
    verified_at: 1777486360
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"5;1"'
    sql: "SELECT ct.PAYER_ID, ct.PLAN_ID, ct.FILING_LIMIT_DAYS, ct.APPEAL_WINDOW_DAYS, ct.TIMELY_FILING_DAYS FROM contracts AS ct WHERE ct.TERM_DATE >= CURRENT_DATE OR ct.TERM_DATE IS NULL"
    question: What are the filing deadlines and appeal windows for active contracts?
    verified_at: 1777486360
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: VQR_OVERTURN_RATES_ALL_PAYERS
    sql: "SELECT dh.DENIAL_CODE, dh.DENIAL_GROUP, dh.PAYER_ID, dh.OVERTURN_RATE_PCT, dh.TOTAL_DENIALS, dh.OVERTURNED_COUNT FROM denial_history AS dh WHERE dh.TOTAL_DENIALS >= 1 ORDER BY dh.OVERTURN_RATE_PCT DESC LIMIT 10"
    question: Which denial codes have the highest overturn rates across all payers?
    verified_at: 1746388800
    verified_by: CortexCode
    use_as_onboarding_question: true
  - name: VQR_REVENUE_AT_RISK_30_DAYS
    sql: "SELECT d.CLAIM_ID, d.DENIAL_CODE, d.DENIAL_AMOUNT, d.DENIAL_DATE, ct.APPEAL_WINDOW_DAYS, DATEADD(DAY, ct.APPEAL_WINDOW_DAYS, d.DENIAL_DATE) AS APPEAL_DEADLINE, DATEDIFF(DAY, CURRENT_DATE, DATEADD(DAY, ct.APPEAL_WINDOW_DAYS, d.DENIAL_DATE)) AS DAYS_REMAINING FROM denials AS d JOIN claims AS c ON d.CLAIM_ID = c.CLAIM_ID JOIN contracts AS ct ON c.PAYER_ID = ct.PAYER_ID WHERE DATEDIFF(DAY, CURRENT_DATE, DATEADD(DAY, ct.APPEAL_WINDOW_DAYS, d.DENIAL_DATE)) BETWEEN 0 AND 30 ORDER BY d.DENIAL_AMOUNT DESC"
    question: How much revenue is at risk from claims expiring in the next 30 days?
    verified_at: 1746388800
    verified_by: CortexCode
    use_as_onboarding_question: true
  - name: VQR_TOP5_ROOT_CAUSES_BY_AMOUNT
    sql: "SELECT d.DENIAL_CODE, d.DENIAL_REASON, COUNT(*) AS denial_count, SUM(d.DENIAL_AMOUNT) AS total_denied_amount FROM denials AS d GROUP BY d.DENIAL_CODE, d.DENIAL_REASON ORDER BY total_denied_amount DESC LIMIT 5"
    question: What are the top 5 root causes of denials by dollar amount?
    verified_at: 1746388800
    verified_by: CortexCode
    use_as_onboarding_question: true
  - name: VQR_DENIAL_RATES_BY_PAYER_PRIOR_AUTH
    sql: "SELECT c.PAYER_ID, d.DENIAL_CODE, COUNT(*) AS denial_count, SUM(d.DENIAL_AMOUNT) AS total_denied_amount FROM denials AS d JOIN claims AS c ON d.CLAIM_ID = c.CLAIM_ID WHERE d.DENIAL_REASON ILIKE '%prior auth%' OR d.DENIAL_REASON ILIKE '%authorization%' GROUP BY c.PAYER_ID, d.DENIAL_CODE ORDER BY total_denied_amount DESC"
    question: Compare denial rates across payers for prior authorization issues.
    verified_at: 1746388800
    verified_by: CortexCode
    use_as_onboarding_question: true
  - name: VQR_PROVIDERS_HIGHEST_DENIAL_VOLUME
    sql: "SELECT c.PROVIDER_NAME, COUNT(*) AS denial_count, SUM(d.DENIAL_AMOUNT) AS total_denied_amount FROM denials AS d JOIN claims AS c ON d.CLAIM_ID = c.CLAIM_ID WHERE d.DENIAL_DATE >= DATE_TRUNC('QUARTER', CURRENT_DATE) GROUP BY c.PROVIDER_NAME ORDER BY denial_count DESC"
    question: Which providers have the highest denial volume this quarter?
    verified_at: 1746388800
    verified_by: CortexCode
    use_as_onboarding_question: true
